services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yupachei-backend
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    networks:
      - yupachei-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yupachei-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - yupachei-net

networks:
  yupachei-net:
    driver: bridge

